# Local orchestration: trading engine + Redis (event bridge) + QuestDB (ticks/bars)
# + Prometheus + Grafana. Broker credentials come from a local .env file (never committed).
services:
  engine:
    build: .
    command: ["--paper", "--config", "config/strategy_etf.yaml", "--broker", "${BROKER:-sim}", "--metrics-port", "9108"]
    env_file: [{path: .env, required: false}]
    environment:
      - QUANTBOT_LIVE_CONFIRM=${QUANTBOT_LIVE_CONFIRM:-NO}
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./models:/app/models
    ports: ["9108:9108"]
    depends_on: [redis, questdb]
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    ports: ["6379:6379"]

  questdb:
    image: questdb/questdb:8.1.1
    ports: ["9000:9000", "9009:9009", "8812:8812"]
    volumes: [questdb-data:/var/lib/questdb]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: [./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]
    depends_on: [engine]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./quantbot/monitoring/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  questdb-data:
